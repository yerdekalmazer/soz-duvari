<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Söz Duvarı — Galeri duvarı</title>
<style>
  :root {
    --duvar:#cfc8bd; --panel:#f4f1ec; --cizgi:#e3ddd3; --yazi:#26221e; --soluk:#8a8178; --vurgu:#26221e;
    --u:clamp(12px, 1.8vw, 28px); --pw:320px;
  }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--duvar); font:13.5px/1.45 Inter, system-ui, -apple-system, sans-serif; color:var(--yazi);
         display:grid; grid-template-columns:var(--pw) 1fr; min-height:100vh }
  button, select, input { font:inherit; color:inherit }
  button { cursor:pointer }

  /* ---------- panel ---------- */
  aside { position:sticky; top:0; height:100vh; background:var(--panel); border-right:1px solid var(--cizgi);
          display:flex; flex-direction:column }
  .bas { padding:22px 22px 6px }
  .bas h1 { font-size:16px; font-weight:650; letter-spacing:-.01em }
  .bas p { color:var(--soluk); font-size:12.5px; margin-top:2px }
  .bolum { padding:16px 22px 4px }
  .bolum-bas { display:flex; align-items:baseline; gap:8px; margin-bottom:10px }
  .bolum-bas h2 { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--soluk); margin-right:auto }
  .bolum-bas button { background:none; border:none; padding:0; font-size:12px; color:var(--soluk) }
  .bolum-bas button:hover { color:var(--yazi) }

  .formatlar { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px }
  .fmt { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 2px 8px; background:#fff;
         border:1px solid var(--cizgi); border-radius:8px; font-size:11px; line-height:1.2; color:var(--soluk) }
  .fmt i { display:block; border:1.5px solid currentColor; border-radius:2px; height:26px }
  .fmt.on { border-color:var(--vurgu); color:var(--yazi); box-shadow:inset 0 0 0 1px var(--vurgu) }
  .fmt:not(.on) { opacity:.6 }
  .fmt-not { font-size:11.5px; color:var(--soluk); margin-top:8px; min-height:17px }

  .stiller { display:flex; background:#fff; border:1px solid var(--cizgi); border-radius:8px; padding:3px; gap:3px }
  .stil { flex:1; border:none; background:none; padding:6px 0; border-radius:6px; color:var(--soluk) }
  .stil.on { background:var(--vurgu); color:#fff }

  .sozler-bolum { flex:1; min-height:0; display:flex; flex-direction:column; padding-bottom:0 }
  .ara { width:100%; padding:8px 10px; border:1px solid var(--cizgi); border-radius:8px; background:#fff; margin-bottom:6px; outline:none }
  .ara:focus { border-color:#bdb4a8 }
  .liste { overflow-y:auto; margin:0 -22px; padding:0 14px 12px }
  .soz { display:flex; gap:10px; width:100%; text-align:left; background:none; border:none; padding:8px; border-radius:7px }
  .soz:hover { background:#0000000a }
  .soz .kutu { flex:none; width:16px; height:16px; margin-top:2px; border:1.5px solid #b7ada1; border-radius:4px; display:grid; place-items:center }
  .soz.on .kutu { background:var(--vurgu); border-color:var(--vurgu) }
  .soz.on .kutu::after { content:''; width:8px; height:4px; border:solid #fff; border-width:0 0 1.6px 1.6px; transform:translateY(-1px) rotate(-45deg) }
  .soz b { display:block; font-weight:600; font-size:12.5px }
  .soz span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--soluk); font-size:12.5px }
  .soz:not(.on) b { color:var(--soluk) }

  .alt { border-top:1px solid var(--cizgi); padding:14px 22px 18px; background:var(--panel) }
  .indir { width:100%; padding:11px; border:none; border-radius:8px; background:var(--vurgu); color:#fff; font-weight:600 }
  .indir:disabled { opacity:.4; cursor:default }
  .alt small { display:block; text-align:center; color:var(--soluk); font-size:11.5px; margin-top:7px }

  /* ---------- duvar ---------- */
  main { min-width:0 }
  .ust { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:8px; padding:14px 28px;
         background:#cfc8bdeb; backdrop-filter:blur(8px) }
  .ust .say { margin-right:auto; color:#4a433c }
  .ust .say b { font-weight:650; color:var(--yazi) }
  .ust select, .ust button { padding:7px 12px; border:1px solid #0000001f; background:#ffffff8c; border-radius:7px }
  .ust button:hover, .ust select:hover { background:#fff }
  .panel-ac { display:none }
  .duvar { display:grid; grid-template-columns:repeat(auto-fill, var(--u)); grid-auto-rows:var(--u);
           grid-auto-flow:dense; gap:calc(var(--u) * .9); justify-content:center; padding:20px 28px 72px }
  a.c { display:block; box-shadow:0 10px 24px #0003, 0 2px 4px #0002 }
  a.c img { width:100%; height:100%; object-fit:cover; display:block }
  a.c.siyah { background:#141414; padding:calc(var(--u) * .28) }
  a.c.beyaz { background:#f6f3ee; padding:calc(var(--u) * .28) }
  a.c.pasp  { background:#fbfaf7; padding:calc(var(--u) * .8);
              box-shadow:inset 0 0 0 calc(var(--u) * .22) #111, 0 10px 24px #0003, 0 2px 4px #0002 }
  a.c.ince { background:#c49a5b; padding:4px }
  .bos { color:#0008; padding:80px 20px; text-align:center; grid-column:1/-1 }

  @media (max-width:860px){
    body { grid-template-columns:1fr }
    aside { position:fixed; inset:0 auto 0 0; width:min(var(--pw), 88vw); z-index:10; transform:translateX(-102%);
            transition:transform .25s; box-shadow:0 0 40px #0004 }
    body.panel aside { transform:none }
    .panel-ac { display:inline-block }
    .ust { padding:12px 16px } .duvar { padding:16px 16px 64px }
  }
</style>
</head>
<body>
<aside>
  <div class="bas">
    <h1>Söz Duvarı</h1>
    <p>Çerçeveye basılacak sözleri seç, indir.</p>
  </div>

  <div class="bolum">
    <div class="bolum-bas"><h2>Format</h2><button data-tum="fmt">Tümü</button></div>
    <div class="formatlar" id="formatlar"></div>
    <div class="fmt-not" id="fmtNot"></div>
  </div>

  <div class="bolum">
    <div class="bolum-bas"><h2>Stil</h2></div>
    <div class="stiller" id="stiller"></div>
  </div>

  <div class="bolum sozler-bolum">
    <div class="bolum-bas"><h2>Sözler <span id="sozSay"></span></h2><button data-tum="soz">Tümü</button><button data-hic="soz">Hiçbiri</button></div>
    <input class="ara" id="ara" type="search" placeholder="Söz veya yazar ara">
    <div class="liste" id="liste"></div>
  </div>

  <div class="alt">
    <button class="indir" id="indir">İndir</button>
    <small id="boyut"></small>
  </div>
</aside>

<main>
  <div class="ust">
    <button class="panel-ac" id="panelAc">Seçim</button>
    <span class="say" id="say"></span>
    <select id="adet" title="Duvarda kaç parça"><option value="12">12 parça</option><option value="18" selected>18 parça</option><option value="30">30 parça</option><option value="9999">Seçilenlerin hepsi</option></select>
    <button id="karistir">Karıştır</button>
  </div>
  <div class="duvar" id="duvar"></div>
</main>

<script src="cerceve/liste.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// format → ızgara hücresi (genişlik × yükseklik)
const HUCRE = { 'dikey-2x3':[6,9], 'dikey-3x4':[6,8], 'dikey-A-serisi':[5,7], 'kare':[6,6], 'yatay-3x2':[9,6] };
const KUCUK = { 'dikey-2x3':[4,6], 'dikey-3x4':[3,4], 'dikey-A-serisi':[5,7], 'kare':[4,4], 'yatay-3x2':[6,4] };
const BUYUK = { 'dikey-2x3':[8,12], 'dikey-3x4':[9,12], 'dikey-A-serisi':[10,14], 'kare':[8,8], 'yatay-3x2':[12,8] };
const FMT_KISA = { 'dikey-2x3':['2:3', 2/3], 'dikey-3x4':['3:4', 3/4], 'dikey-A-serisi':['A', 1/Math.SQRT2], 'kare':['Kare', 1], 'yatay-3x2':['3:2', 3/2] };
const CERCEVE = ['siyah', 'siyah', 'beyaz', 'pasp', 'ince'];
const STIL_AD = { sade:'Sade', bant:'Bant', minimal:'Minimal' };
const rnd = a => a[Math.floor(Math.random() * a.length)];
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const TUMU = { soz:Object.keys(SOZLER), fmt:Object.keys(FORMAT_AD), stil:Object.keys(STIL_AD) };
const SOZ_SIRA = TUMU.soz.slice().sort((a, b) => SOZLER[a][1].localeCompare(SOZLER[b][1], 'tr'));
const BOYUT = {}; // dosya boyutu tahmini için ortalama (MB)

const SEC = { soz:new Set(TUMU.soz), fmt:new Set(TUMU.fmt), stil:new Set(TUMU.stil) };
try { const k = JSON.parse(localStorage.getItem('duvar-secim')); if (k) for (const g in SEC) if (k[g]) SEC[g] = new Set(k[g].filter(x => TUMU[g].includes(x))); } catch(e){}
const kaydet = () => { try { localStorage.setItem('duvar-secim', JSON.stringify(Object.fromEntries(Object.entries(SEC).map(([g, s]) => [g, [...s]])))); } catch(e){} };

function panel(){
  $('#formatlar').innerHTML = TUMU.fmt.map(k => {
    const [ad, r] = FMT_KISA[k];
    return `<button class="fmt${SEC.fmt.has(k) ? ' on' : ''}" data-g="fmt" data-k="${k}" title="${FORMAT_AD[k]}"><i style="width:${Math.round(26 * r)}px"></i>${ad}</button>`;
  }).join('');
  const f = TUMU.fmt.filter(k => SEC.fmt.has(k));
  $('#fmtNot').textContent = f.length === 1 ? FORMAT_AD[f[0]] : f.length ? `${f.length} format seçili` : 'Format seçilmedi';
  $('#stiller').innerHTML = TUMU.stil.map(k => `<button class="stil${SEC.stil.has(k) ? ' on' : ''}" data-g="stil" data-k="${k}">${STIL_AD[k]}</button>`).join('');
  const q = $('#ara').value.trim().toLocaleLowerCase('tr');
  $('#liste').innerHTML = SOZ_SIRA.filter(k => !q || (SOZLER[k][1] + ' ' + SOZLER[k][0]).toLocaleLowerCase('tr').includes(q)).map(k =>
    `<button class="soz${SEC.soz.has(k) ? ' on' : ''}" data-g="soz" data-k="${k}"><span class="kutu"></span><div><b>${esc(SOZLER[k][1])}</b><span>${esc(SOZLER[k][0])}</span></div></button>`
  ).join('') || '<p class="bos" style="padding:24px">Eşleşen söz yok</p>';
  $('#sozSay').textContent = `· ${SEC.soz.size}/${TUMU.soz.length}`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-g], [data-tum], [data-hic]'); if (!t) return;
  if (t.dataset.tum) TUMU[t.dataset.tum].forEach(k => SEC[t.dataset.tum].add(k));
  else if (t.dataset.hic) SEC[t.dataset.hic].clear();
  else { const g = SEC[t.dataset.g]; g.has(t.dataset.k) ? g.delete(t.dataset.k) : g.add(t.dataset.k); }
  kaydet(); panel(); diz();
});
$('#ara').oninput = panel;

const secili = () => CERCEVELER.filter(([fmt, , soz, stil]) => SEC.fmt.has(fmt) && SEC.soz.has(soz) && SEC.stil.has(stil));

function diz(){
  const el = $('#duvar'), L = secili();
  $('#say').innerHTML = `<b>${L.length}</b> görsel · ${SEC.soz.size} söz`;
  $('#indir').disabled = !L.length;
  $('#indir').textContent = L.length ? `${L.length} görseli indir` : 'Seçim boş';
  $('#boyut').textContent = L.length ? `ZIP · yaklaşık ${Math.max(1, Math.round(L.length * 1.0))} MB · Drive klasör düzeninde` : 'En az bir söz, format ve stil seç';
  if (!L.length){ el.innerHTML = '<p class="bos">Seçime uyan görsel yok.</p>'; return; }
  const n = +$('#adet').value;
  // önce her sözden birer tane, sonra kalanlar: aynı söz duvarda yığılmasın
  const karisik = [...L].sort(() => Math.random() - .5), ilk = [], sonra = [], gorulen = new Set();
  for (const k of karisik) (gorulen.has(k[2]) ? sonra : (gorulen.add(k[2]), ilk)).push(k);
  el.innerHTML = [...ilk, ...sonra].slice(0, n).map(([fmt, dosya]) => {
    const r = Math.random(), [w, h] = (r < .2 ? BUYUK : r < .55 ? KUCUK : HUCRE)[fmt];
    const src = `cerceve/${fmt}/${dosya}`;
    return `<a class="c ${rnd(CERCEVE)}" href="${src}" target="_blank" style="grid-column:span ${w};grid-row:span ${h}"><img loading="lazy" src="${src}" alt=""></a>`;
  }).join('');
}

$('#indir').onclick = async () => {
  const L = secili(), b = $('#indir'), ad = b.textContent;
  if (typeof JSZip === 'undefined'){ b.textContent = 'ZIP kütüphanesi yüklenemedi'; setTimeout(() => b.textContent = ad, 3000); return; }
  b.disabled = true;
  try {
    const zip = new JSZip();
    let i = 0;
    for (const [fmt, dosya, , , yol] of L){
      b.textContent = `Hazırlanıyor ${++i} / ${L.length}`;
      const r = await fetch(`cerceve/${fmt}/${dosya}`);
      zip.file(`Söz Duvarı/${yol}`, await r.blob());
    }
    b.textContent = 'Paketleniyor…';
    const blob = await zip.generateAsync({ type:'blob', compression:'STORE' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `Söz Duvarı (${L.length} görsel).zip`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  } finally { b.textContent = ad; b.disabled = false; }
};

$('#karistir').onclick = diz;
$('#adet').onchange = diz;
$('#panelAc').onclick = e => { e.stopPropagation(); document.body.classList.toggle('panel'); };
$('main').addEventListener('click', e => { if (!e.target.closest('.ust')) document.body.classList.remove('panel'); });
panel(); diz();
</script>
</body>
</html>
